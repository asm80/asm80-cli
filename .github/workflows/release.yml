name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check tag matches package.json version
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")" || { echo "Tag neodpovídá verzi v package.json"; exit 1; }

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Smoke test bundles
        run: scripts/smoke.sh

      - name: Build binaries
        run: |
          mkdir -p dist
          TARGETS=$(node -p "require('./package.json').pkg.targets.join(',')")
          echo "pkg targets: $TARGETS"
          for util in asm80 asm80-link asm80-ar asm80-run; do
            npx pkg "${util}.js" --targets "$TARGETS" --out-path dist/
          done

      - name: List dist/
        run: ls -la dist/

      - name: Smoke test Linux binaries
        run: scripts/smoke.sh dist

      - name: Create GitHub Release and upload binaries
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.exe
            dist/*-linux*
            dist/*-macos*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    runs-on: ubuntu-latest
    needs: build-and-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - name: Smoke test bundles
        run: scripts/smoke.sh
      - name: Check package contents
        run: npm pack --dry-run
      - run: npm publish --provenance
