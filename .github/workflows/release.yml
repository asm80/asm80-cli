name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build binaries
        run: |
          mkdir -p dist
          for util in asm80 asm80-link asm80-ar asm80-run; do
            npx @yao-pkg/pkg ${util}.mjs \
              --targets node18-win-x64,node18-linux-x64,node18-macos-x64,node18-macos-arm64 \
              --out-path dist/
          done

      - name: List dist/
        run: ls -la dist/

      - name: Create GitHub Release and upload binaries
        uses: softprops/action-gh-release@v2
        with:
          # Exclude .cmd shims that pkg emits for Windows targets
          files: |
            dist/*.exe
            dist/*-linux*
            dist/*-macos*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    runs-on: ubuntu-latest
    needs: build-and-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - run: npm publish --provenance